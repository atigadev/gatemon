; Pengaturan PHP untuk hosting (cPanel PHP-FPM/CGI membaca file ini; XAMPP mod_php mengabaikannya).
; Error tidak ditampilkan ke pengunjung (tetap dicatat di error_log). Batas unggah untuk wallpaper (maks. 25 MB).
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
upload_max_filesize = 30M
post_max_size = 32M
max_execution_time = 300
session.use_strict_mode = 1
session.cookie_httponly = 1
session.use_only_cookies = 1
